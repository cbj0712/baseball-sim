version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: baseball-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: baseball
      POSTGRES_USER: baseball
      POSTGRES_PASSWORD: baseball
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
